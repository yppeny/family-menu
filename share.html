<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>家庭点菜 - 扫码使用</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100dvh;
      background: linear-gradient(135deg, #f97316, #fb923c);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 20px; color: #fff; text-align: center;
    }
    .card {
      background: #fff; border-radius: 24px; padding: 32px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 360px; width: 100%;
    }
    .logo { font-size: 56px; margin-bottom: 12px; }
    h1 { color: #1a1a1a; font-size: 24px; margin-bottom: 6px; }
    .sub { color: #999; font-size: 14px; margin-bottom: 24px; }
    .qr-box {
      background: #fafafa; border-radius: 16px; padding: 16px;
      display: inline-block; margin-bottom: 20px;
    }
    .qr-box img { width: 200px; height: 200px; display: block; }
    .hint { color: #999; font-size: 13px; margin-bottom: 16px; }
    .btn {
      display: inline-block; padding: 12px 32px; border-radius: 12px;
      background: #f97316; color: #fff; font-size: 16px; font-weight: 600;
      text-decoration: none; transition: transform 0.15s;
    }
    .btn:active { transform: scale(0.96); }
    .footer { margin-top: 20px; color: rgba(255,255,255,0.7); font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🍳</div>
    <h1>家庭点菜</h1>
    <p class="sub">扫码打开，全家一起点菜</p>
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https%3A%2F%2Ffamily-menu-eosin.vercel.app" alt="扫码访问家庭点菜" />
    </div>
    <p class="hint">📱 微信 / 支付宝 / 相机 扫码均可</p>
    <a class="btn" href="https://family-menu-eosin.vercel.app" target="_blank">直接打开</a>
  </div>
  <p class="footer">添加到手机桌面，体验更佳</p>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
